[Rainmeter]
Update=20
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=10Anim
Author=JSMorley
Information=Test of animation
Version=Apr 12, 2014
License=Creative Commons Attribution-Non-Commercial-Share Alike 3.0

[Variables]
@Include=#@#variables.inc
ImagePath=#@#Images\
ImagePath2=#@#Images2\
ImagePath3=#@#Images3\
OverStart=1
OverEnd=5
DownStart=6
DownEnd=10
CurrentPos=1
MouseState=Off

-------------------------------------------------------------------------------------

buttons

-------------------------------------------------------------------------------------


[MeasureAnimScript]
Measure=Script
ScriptFile=#CURRENTPATH#10Anim.lua
Disabled=1


[MeterImageBack]
Meter=Image
X=330
Y=577
W=60
H=60
SolidColor=47,47,47,0
MouseOverAction=[!SetVariable MouseState "Over"][!EnableMeasure MeasureAnimScript]
LeftMouseDownAction=[!SetVariable MouseState "Down"][!EnableMeasure MeasureAnimScript]
LeftMouseUpAction=[!SetVariable MouseState "Up"][!EnableMeasure MeasureAnimScript]
MouseLeaveAction=[!SetVariable MouseState "Off"][!EnableMeasure MeasureAnimScript]


[MeterImage]
Meter=Image
X=330
Y=577
ImagePath=#ImagePath#
ImageName=1.png
LeftMouseUpAction=!Execute [::{20D04FE0-3AEA-1069-A2D8-08002B30309D}]

[MeterText]
Meter=String
X=346
Y=598
W=200
H=200
FontFace=#FontName#
FontSize=6
FontColor=#FColor6#
SolidColor=47,47,47,0
Padding=5,5,5,5
AntiAlias=0
Text=COMP
Hidden=1

