[Rainmeter]
DynamicWindowSize=1
BackgroundMode=1
Update=1000

[Metadata]
Author=Edhel, http://squirrel-slayer.deviantart.com
Information=Exemplary skin for demonstration of the use of ColorSetter Beta. Open this and click the buttons to change the colors of clock. Look at the end for the necessary bang.
License=Creative Commons BY-NC-SA 3.0
Version=1.21

[Variables]
@Include=#@#variables.inc


;-----------------------------------------------------------------------------------
;					Meters
;-----------------------------------------------------------------------------------


[Lcolor1]
Meter=String
MeterStyle=Text
StringAlign=Left
FontFace=#FontName#
FontColor=#Fcolor1#
X=0
Y=0
Text=Lcolor1
SolidColor=0,0,0,155
LeftMouseUpAction=[!WriteKeyValue Variables changedcolorvariable "LColor1" "#@#variables-color.inc"][!RainmeterActivateConfig "TECH-B" "ColorSetter-Alpha.ini"]

