[Rainmeter]
BackgroundMode=1
Author=Burnwell88
AppVersion=10000
Update=20

[Variables]
@include1=#SKINSPATH#TECH-A\SETTINGS\variables.inc

[CalcMeasure200]
Measure=Calc
Formula=Counter %200

[MeasureTime200]
Measure=Calc
Formula=CalcMeasure200

[CalcMeasure1500]
Measure=Calc
Formula=Counter %1500

[MeasureTime1500]
Measure=Calc
Formula=CalcMeasure1500

[CalcMeasure2500]
Measure=Calc
Formula=Counter %2500

[MeasureTime2500]
Measure=Calc
Formula=CalcMeasure2500

[MeasureCPU]
Measure=CPU
AverageSize=50
 
[MeasureSpinner]
Measure=Calc
Formula=(MeasureSpinner + MeasureCPU/50)%100
MinValue=0
MaxValue=100

