[Rainmeter]
BackgroundMode=1
Author=Burnwell88
AppVersion=10000
Update=50

[Variables]
@Include=#@#variables.inc

[CalcMeasure10]
Measure=Calc
Formula=Counter %10

[MeasureTime10]
Measure=Calc
Formula=CalcMeasure10

[CalcMeasure1500]
Measure=Calc
Formula=Counter %1500

[MeasureTime1500]
Measure=Calc
Formula=CalcMeasure1500

[CalcMeasure1000]
Measure=Calc
Formula=Counter %1000

[MeasureTime1000]
Measure=Calc
Formula=CalcMeasure1000

[CalcMeasure2500]
Measure=Calc
Formula=Counter %2500

[MeasureTime2500]
Measure=Calc
Formula=CalcMeasure2500

[MeasureCPU]
Measure=CPU
AverageSize=50
 
[MeasureSpinner]
Measure=Calc
Formula=(MeasureSpinner + MeasureCPU/50)%100
MinValue=0
MaxValue=100

