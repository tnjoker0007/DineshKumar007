[Rainmeter]
Name=Barred
Author=dv-ent.deviantart.com
Update=100
DynamicWindowSize=1


[Variables]
@Include=#@#variables.inc




[1]
FontSize=6
FontColor=#CfgColor#
FontFace=#Font4#
StringAlign=left
StringStyle=NORMAL
AntiAlias=0


[Background]
Meter=Image
ImageName=#ROOTCONFIGPATH#Images\Cfgback.png
AntiAlias=1
x=0
y=0
===============================================

drives

------------------------------------------------------------------------------------------------------------

[Text1]
meter=string
meterstyle=1
text="Drive1"
MeterStyle=1
x=25
y=25

[Drive1]
Meter=string
MeterStyle=1
Text="#Drive1#"
MeterStyle=1
x=115
y=r
LeftMouseUpAction=!CommandMeasure "MeasureDrive1 ExecuteBatch 1"
DynamicVariables=1



[MeasureDrive1]
Measure=PLUGIN
Plugin=InputText.dll
W=30
H=10
x=115
y=25
SolidColor=0,0,0
FontFace=#Font4#
FontSize=#FontHeight3#
FontColor=#FColor1#
StringStyle=NORMAL
AntiAlias=0
FocusDismiss=1
command1=!Execute [!WriteKeyValue Variables Drive1 "$UserInput$" "#@#variables.inc"][!Refresh *]



