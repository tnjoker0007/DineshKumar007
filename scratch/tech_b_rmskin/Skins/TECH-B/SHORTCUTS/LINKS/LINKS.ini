[Rainmeter]
BackgroundMode=1
Author=Burnwell88
AppVersion=10000
Update=50

[Variables]
@Include=#@#variables.inc
AntiAlias=1

[MeasureRing]
Measure=Calc
Formula=360

[MeasureRing2]
Measure=Calc
Formula=360


=============================================================================

LINKS

===================================================================================================



[Meterimage]
Meter=IMAGE
SolidColor=0,0,0,0
W=50
H=50
X=0
Y=0


-----------------------------------------------------

[MeterText]
Meter=STRING
X=108
Y=120
FontColor=#FColor1#
StringStyle=NORMAL
FontSize=#FontHeight3#
StringAlign=RIGHT
FontFace=#Font2#
AntiAlias=#AntiAlias#
Hidden=0
Prefix="UNLIMITED"
LeftMouseDownAction= !execute ["http://www.nfsunlimited.net"]
MouseOverAction=[!SetOption MeterText FontColor #FColor2#][!UpdateMeter App1][!Redraw]
MouseLeaveAction=[!SetOption MeterText FontColor #FColor1#][!UpdateMeter App1][!Redraw]

